{% extends "base.html" %}
{% block title %}管理员后台 - 登录日志{% endblock %}

{% block content %}
<div class="card p-4">
    <h3 class="text-primary mb-3">管理员后台｜登录日志</h3>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead class="table-primary">
                <tr>
                    <th>学号</th>
                    <th>登录时间</th>
                    <th>登录状态</th>
                </tr>
            </thead>
            <tbody>
                {% for log in log_list %}
                <tr>
                    <td>{{log[0]}}</td>
                    <td>{{log[1]}}</td>
                    <td>{{log[2]}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
