<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}校园二手贸易登录系统{% endblock %}</title>
    <!-- Bootstrap5 蓝白样式CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* 全局蓝白自定义样式 */
        body {
            background-color: #f0f7ff; /* 极浅蓝背景 */
            font-family: "Microsoft Yahei", sans-serif;
        }
        .card{
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(22, 119, 255, 0.12);
            border: none;
        }
        .btn-primary{
            background-color: #1677ff;
            border-color: #1677ff;
        }
        .btn-primary:hover{
            background-color: #0f68e0;
        }
        .navbar{
            background-color:#1677ff !important;
        }
        .form-control:focus{
            border-color:#1677ff;
            box-shadow:0 0 0 0.2rem rgba(22,119,255,0.25);
        }
    </style>
</head>
<body>
    <!-- 顶部蓝色导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">校园二手贸易账号登录系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    {% if session.student_id %}
                        <li class="nav-item">
                            <a class="nav-link" href="/logout">退出登录</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 消息提示框（登录错误/注册成功提示） -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-info alert-dismissible fade show" role="alert">
                        {{ msg }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
