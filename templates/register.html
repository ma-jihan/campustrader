{% extends "base.html" %}
{% block content %}
<div class="card" style="width:420px; margin:50px auto; padding:30px;">
    <h2 style="text-align:center; color:#0066ff;">用户注册</h2>
    <form method="post">
        <div style="margin-bottom:20px;">
            <label>学号</label>
            <input type="text" name="student_id" class="form-control" value="{{student_id}}" placeholder="输入学号">
            <!-- 学号专属错误提示，紧贴学号框下方 -->
            {% if error and "学号格式错误" in error %}
            <div style="color:red; font-size:16px; margin-top:4px;">
                学号格式错误：仅支持10位新版或13位旧版学号
            </div>
            {% endif %}
        </div>
        <div style="margin-bottom:20px;">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" value="{{username}}" placeholder="输入用户名">
        </div>
        <div style="margin-bottom:20px;">
            <label>手机号</label>
            <input type="text" name="phone" class="form-control" value="{{phone}}" placeholder="选填，输入手机号">
        </div>
        <div style="margin-bottom:20px;">
            <label>密码</label>
            <input type="password" name="password" class="form-control" placeholder="输入密码">
        </div>
        <div style="margin-bottom:10px;">
            <label>确认密码</label>
            <input type="password" name="password2" class="form-control" placeholder="再次输入密码">
        </div>

        <!-- 其他类型错误（空、重复学号、密码不一致等）放这里 -->
        {% if error and "学号格式错误" not in error %}
        <div style="color:red; margin-bottom:20px; font-size:16px;">
            {{ error }}
        </div>
        {% endif %}

        <div style="text-align:center;">
            <button type="submit" class="btn btn-primary">注册</button>
        </div>
        <div style="text-align:center; margin-top:15px;">
            <span>已有账号？<a href="{{ url_for('login') }}">去登录</a></span>
        </div>
    </form>
</div>
{% endblock %}
